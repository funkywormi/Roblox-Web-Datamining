module.exports = "<div class=\"stack badge-container\" ng-if=\"$ctrl.badges.data.length > 0\"> <div class=\"container-header\"> <h2 ng-bind=\"'HeadingGameBadges' | translate\"></h2> </div> <ul class=\"stack-list\"> <li ng-repeat=\"badge in $ctrl.badges.data | limitTo: $ctrl.badges.displayedBadgeCount\" class=\"stack-row badge-row\"> <div class=\"badge-image\"> <a href=\"{{ badge.detailsPageUrl }}\"> <thumbnail-2d thumbnail-type=\"$ctrl.thumbnailTypes.badgeIcon\" thumbnail-target-id=\"badge.id\"/> </a> </div> <div class=\"badge-content\"> <div class=\"badge-data-container\"> <div class=\"font-header-2 badge-name\" ng-bind=\"badge.name\"></div> <p class=\"para-overflow\" ng-bind=\"badge.description\"></p> </div> <ul class=\"badge-stats-container\"> <li> <div class=\"text-label\" ng-bind=\"'LabelRarity' | translate\"></div> <div class=\"font-header-2 badge-stats-info\">{{ badge.winRatePercentage | number : 1 }}% ({{ badge.rarityName }})</div> </li> <li> <div class=\"text-label\" ng-bind=\"'LabelWonYesterday' | translate\"></div> <div class=\"font-header-2 badge-stats-info\" ng-bind=\"badge.pastDayAwardedCount\"></div> </li> <li> <div class=\"text-label\" ng-bind=\"'LabelWonEver' | translate\"></div> <div class=\"font-header-2 badge-stats-info\" ng-bind=\"badge.awardedCount\"></div> </li> </ul> </div> </li> <li ng-if=\"$ctrl.badges.displayedBadgeCount < $ctrl.badges.data.length\"> <button type=\"button\" class=\"btn-full-width btn-control-sm\" ng-bind=\"'LabelSeeMore' | translate\" ng-click=\"$ctrl.seeMore()\"></button> </li> </ul> </div>";
