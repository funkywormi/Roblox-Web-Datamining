module.exports = "<div class=\"container-header\"> <h2 class=\"title-with-input\" ng-bind=\"'Label.Summary' | translate\"></h2> <div class=\"input-group\"> <div class=\"input-group-btn group-dropdown\" uib-dropdown=\"\"> <button type=\"button\" uib-dropdown-toggle=\"\" class=\"input-dropdown-btn\"> <span class=\"rbx-selection-label\" title=\"{{ $ctrl.currentTimeFrame }}\" ng-bind=\"$ctrl.getTimeFrameLabel($ctrl.currentTimeFrame)\"></span> <span class=\"icon-down-16x16\"></span> </button> <ul class=\"dropdown-menu time-frame-dropdown\" role=\"menu\" uib-dropdown-menu=\"\"> <li ng-repeat=\"timeFrame in $ctrl.timeFrames\"> <a ng-click=\"$ctrl.updateTimeFrame(timeFrame)\" ng-bind=\"$ctrl.getTimeFrameLabel(timeFrame)\"></a> </li> </ul> </div> </div> </div> <div class=\"section\"> <div class=\"section-content-off\" ng-show=\"$ctrl.loadRevenueSummaryError\" ng-bind=\"'Message.UnableToLoadRevenue' | translate\"></div> <table class=\"table section-content\" ng-class=\"{'faded': $ctrl.layout.isLoading}\" ng-hide=\"$ctrl.loadRevenueSummaryError\"> <tbody class=\"border-bottom\"> <tr> <th ng-bind=\"'Heading.Categories' | translate\"></th> <th ng-bind=\"'Heading.GroupAmount' | translate\"></th> </tr> <tr> <td ng-bind=\"'Label.SaleOfGoods' | translate\"></td> <td class=\"icon-robux-container\"> <span class=\"icon-robux-16x16\"></span> <span ng-bind=\"$ctrl.revenueSummary.itemSaleRobux | number\"></span> </td> </tr> <tr ng-if=\"$ctrl.economyMetadata.isPublishingAdvanceRebatePageEnabled\"> <td ng-bind=\"'Label.PublishingAdvanceRebates' | translate\"></td> <td class=\"icon-robux-container\"> <span class=\"icon-robux-16x16\"></span> <span ng-bind=\"$ctrl.revenueSummary.publishingAdvanceRebates | number\"></span> </td> </tr> <tr ng-if=\"$ctrl.economyMetadata.isGroupCommissionsPageEnabled\"> <td ng-bind=\"'Label.Commissions' | translate\"></td> <td class=\"icon-robux-container\"> <span class=\"icon-robux-16x16\"></span> <span ng-bind=\"$ctrl.revenueSummary.commissionRobux | number\"></span> </td> </tr> <tr> <td ng-bind=\"'Label.GroupPayouts' | translate\"></td> <td class=\"icon-robux-container\"> <span class=\"icon-robux-16x16\"></span> <span ng-bind=\"$ctrl.revenueSummary.groupPayoutRobux | number\"></span> </td> </tr> <tr> <td ng-bind=\"'Label.CommunityCreatorRewards' | translate\"></td> <td class=\"icon-robux-container\"> <span class=\"icon-robux-16x16\"></span> <span ng-bind=\"$ctrl.revenueSummary.creatorRewardsPayoutRobux | number\"></span> </td> </tr> <tr ng-if=\"$ctrl.revenueSummary.immersiveAdPayouts > 0 || ($ctrl.revenueSummary.immersiveAdPayouts == 0 && $ctrl.revenueSummary.isShowImmersiveAdPayoutSummaryOnZeroEnabled)\"> <td ng-bind=\"'Label.ImmersiveAdPayouts' | translate\"></td> <td class=\"icon-robux-container\"> <span class=\"icon-robux-16x16\"></span> <span ng-bind=\"$ctrl.revenueSummary.immersiveAdPayouts | number\"></span> </td> </tr> <tr ng-if=\"$ctrl.revenueSummary.subscriptionPayouts > 0\"> <td ng-bind=\"'Label.SubscriptionsPayouts' | translate\"></td> <td class=\"icon-robux-container\"> <span class=\"icon-robux-16x16\"></span> <span ng-bind=\"$ctrl.revenueSummary.subscriptionPayouts | number\"></span> </td> </tr> <tr ng-if=\"$ctrl.revenueSummary.subscriptionClawbacks > 0\"> <td ng-bind=\"'Label.SubscriptionsPayoutReversals' | translate\"></td> <td class=\"icon-robux-container\"> <span class=\"icon-robux-16x16\"></span> <span ng-bind=\"(-1 * $ctrl.revenueSummary.subscriptionClawbacks) | number\"></span> </td> </tr> </tbody> <tfoot> <tr> <td ng-bind=\"'Label.Total' | translate\"></td> <td class=\"icon-robux-container\"> <span class=\"icon-robux-16x16\"></span> <span ng-bind=\"($ctrl.revenueSummary.itemSaleRobux +\n          $ctrl.revenueSummary.groupPayoutRobux +\n          $ctrl.revenueSummary.creatorRewardsPayoutRobux +\n          $ctrl.revenueSummary.immersiveAdPayouts +\n          $ctrl.revenueSummary.subscriptionPayouts +\n          (-1 * $ctrl.revenueSummary.subscriptionClawbacks) +\n          ($ctrl.economyMetadata.isGroupCommissionsPageEnabled ?\n          $ctrl.revenueSummary.commissionRobux : 0)) |\n          number\"></span> </td> </tr> <tr class=\"pending\"> <td class=\"pending-sales\"> <span ng-bind=\"'Label.PendingRobux' | translate\"></span> </td> <td class=\"icon-robux-container\"> <span class=\"icon-robux-16x16\"></span> <span ng-bind=\"$ctrl.revenueSummary.pendingRobux | number\"></span> </td> </tr> <tr> <td></td> </tr> <tr ng-if=\"$ctrl.revenueSummary.individualToGroupRobux > 0\"> <td ng-bind=\"'Label.IndividualToGroupTotal' | translate\"></td> <td class=\"icon-robux-container\"> <span class=\"icon-robux-16x16\"></span> <span ng-bind=\"$ctrl.revenueSummary.individualToGroupRobux | number\"></span> </td> </tr> </tfoot> </table> </div> ";
