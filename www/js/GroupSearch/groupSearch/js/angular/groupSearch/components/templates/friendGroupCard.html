module.exports = "<div class=\"card-item game-card-container\"> <a ng-href=\"{{ $ctrl.url }}\" target=\"_self\" ng-click=\"$ctrl.handleClick == null ? null : $ctrl.handleClick($ctrl.group)\"> <thumbnail-2d thumbnail-type=\"$ctrl.thumbnailTypes.groupIcon\" thumbnail-target-id=\"$ctrl.group.id\" class=\"game-card-thumb-container\"></thumbnail-2d> <div class=\"group-card-name-container\"> <div class=\"text-overflow game-card-name game-card-name-with-verified-badge\" title=\"{{ $ctrl.group.name }}\" ng-bind=\"$ctrl.group.name\"> </div> <span ng-if=\"$ctrl.group.hasVerifiedBadge\" class=\"verified-badge-icon-friend-group-discover\" data-size=\"Title\" data-overrideimgclass=\"verified-badge-icon-friend-group-discover-rendered\"> </span> </div> </a> <ul class=\"game-card-avatar-slots\" ng-if=\"!$ctrl.isV2\"> <friend-list-item ng-repeat=\"friend in $ctrl.friends | limitTo: $ctrl.layout.maxNumberOfDisplayAvatars - 1\" url=\"friend.url\" user-id=\"friend.userId\" username=\"friend.username\"></friend-list-item> <friend-list-item ng-if=\"$ctrl.friends.length === $ctrl.layout.maxNumberOfDisplayAvatars\" url=\"$ctrl.friends[$ctrl.layout.maxNumberOfDisplayAvatars - 1].url\" user-id=\"$ctrl.friends[$ctrl.layout.maxNumberOfDisplayAvatars - 1].userId\" username=\"$ctrl.friends[$ctrl.layout.maxNumberOfDisplayAvatars - 1].username\"></friend-list-item> <li class=\"avatar avatar-headshot avatar-headshot-xs offset-card\" ng-if=\"$ctrl.friends.length > $ctrl.layout.maxNumberOfDisplayAvatars\"> <span class=\"xsmall avatar-offset-label\"> +{{$ctrl.friends.length - $ctrl.layout.maxNumberOfDisplayAvatars + 1}} </span> </li> </ul> <friend-avatars-row ng-if=\"$ctrl.isV2\" friends=\"$ctrl.friends\" max-number-of-display-avatars=\"$ctrl.layout.maxNumberOfDisplayAvatars\"></friend-avatars-row> </div> ";
