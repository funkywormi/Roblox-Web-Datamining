module.exports = "<div class=\"section\" ng-if=\"$ctrl.recipients.length > 0\"> <div class=\"container-header\"> <h2 ng-bind=\"'Heading.Payouts' | translate\"></h2> </div> <div class=\"section-content remove-panel\"> <table class=\"table\"> <tr class=\"border-top\" ng-repeat=\"recipient in $ctrl.recipients\"> <td class=\"user\"> <div class=\"avatar-card\"> <div class=\"avatar avatar-headshot avatar-headshot-sm\"> <a ng-href=\"{{ 'users' | seoUrl:recipient.user.id:'profile' }}\" class=\"avatar-card-link\"> <thumbnail-2d class=\"avatar-card-image\" thumbnail-type=\"$ctrl.thumbnailTypes.avatarHeadshot\" thumbnail-target-id=\"recipient.user.id\"></thumbnail-2d> </a> </div> <div class=\"avatar-card-caption\"> <a class=\"avatar-card-name text-lead text-overflow\" ng-href=\"{{'users' | seoUrl: recipient.user.id:'profile' }}\" ng-bind=\"recipient.user.displayName\"></a> <div class=\"avatar-card-label text-secondary text-overflow\" ng-bind=\"recipient.role.name\"></div> </div> </div> </td> <td class=\"payout-percentage\" ng-bind=\"recipient.percentage + '%'\"></td> </tr> </table> </div> </div>";
