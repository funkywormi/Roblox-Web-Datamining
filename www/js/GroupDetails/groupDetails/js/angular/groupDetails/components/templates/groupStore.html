module.exports = "<div class=\"tab-content rbx-tab-content section col-xs-12 group-store\"> <div class=\"container-header\"> <h2 ng-bind=\"'Heading.Store' | translate\"></h2> <a class=\"btn-secondary-xs btn-more see-all-link-icon\" ng-bind=\"'Action.SeeAll' | translate\" ng-href=\"{{ $ctrl.getCatalogPageUrl() }}\"></a> </div> <div class=\"section-content\" ng-if=\"$ctrl.permissions.groupEconomyPermissions.createItems && $ctrl.permissions.groupEconomyPermissions.manageItems && !$ctrl.metadata.isPhone\"> <p ng-bind=\"'Description.ClothingRevenue' | translate\"></p> <p> <a class=\"text-link\" ng-href=\"{{ $ctrl.getDevelopPageUrl() }}\" ng-bind=\"'Label.ManageGroupCreations' | translate\"></a> </p> </div> <div class=\"spinner spinner-default\" ng-show=\"$ctrl.layout.isLoading && $ctrl.storeItems.length == 0\"> </div> <div class=\"section-content-off\" ng-show=\"!$ctrl.layout.isLoading && $ctrl.storeItems.length == 0\" ng-bind=\"$ctrl.layout.loadError ? 'Message.LoadGroupStoreItemsError' : 'Label.NoStoreItems' | translate\"></div> <ul class=\"hlist item-cards-stackable\" ng-class=\"{'faded' : $ctrl.layout.isLoading && $ctrl.storeItems.length > 0 && !$ctrl.layout.isInfiniteScroll}\" infinite-scroll=\"storePager.loadNextPage()\" infinite-scroll-disabled=\"$ctrl.isInfiniteScrollingDisabled()\"> <group-store-item ng-repeat=\"item in $ctrl.storeItems\" item=\"item\"></group-store-item> </ul> <div ng-show=\"$ctrl.storeItems.length > 0 && !$ctrl.layout.isInfiniteScroll\" class=\"pager-holder\" cursor-pagination=\"storePager\"></div> </div>";
