module.exports = "<ul class=\"slide-items-container switcher-items hlist\"> <li class=\"switcher-item slide-item-container\" ng-repeat=\"group in groups\" ng-show=\"shouldPreLoad($index)\" ng-class=\"{'active': curIdx === $index}\"> <div class=\"col-sm-6 slide-item-container-left\"> <div class=\"slide-item-emblem-container\"> <a ng-href=\"{{ group.groupUrl }}\"> <thumbnail-2d class=\"slide-item-image\" thumbnail-type=\"thumbnailTypes.groupIcon\" thumbnail-target-id=\"group.id\" thumbnail-options=\"thumbnailOptions\"></thumbnail-2d> </a> </div> </div> <div class=\"col-sm-6 text-overflow slide-item-container-right groups\"> <div class=\"slide-item-info\"> <a ng-class=\"showVerifiedBadge(group) ? 'group-title-with-badges' : ''\" ng-href=\"{{ group.groupUrl }}\"> <div ng-class=\"showVerifiedBadge(group) ? 'truncate-with-verified-badge slide-item-name text-overflow groups font-title' : 'slide-item-name text-overflow groups font-title'\" ng-bind=\"group.name\"></div> <span ng-class=\"showVerifiedBadge(group) ? 'verified-badge-icon-group-carousel' : 'hidden'\" data-size=\"Title\" data-additionalimgclass=\"verified-badge-icon-group-carousel-rendered\" data-disablemodal></span> </a> <p class=\"text-description slide-item-description groups\" ng-bind=\"group.description\"></p> </div> <div class=\"slide-item-stats\"> <ul class=\"hlist\"> <li class=\"list-item\"> <div class=\"text-label slide-item-stat-title\" ng-bind=\"'Heading.Members' | translate\"></div> <div class=\"text-lead group-members-count\" ng-bind=\"group.members | abbreviate\"></div> </li> <li class=\"list-item\"> <div class=\"text-label slide-item-stat-title\" ng-bind=\"'Heading.Rank' | translate\"></div> <div class=\"text-lead text-overflow group-rank groups\" ng-bind=\"group.role.name\"></div> </li> </ul> </div> </div> </li> </ul> <a class=\"carousel-control left\" ng-if=\"multipleItems()\" ng-click=\"slidePrev()\"> <span class=\"icon-carousel-left\"></span> </a> <a class=\"carousel-control right\" ng-if=\"mult
