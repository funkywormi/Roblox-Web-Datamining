module.exports = "<div class=\"container-list layer item-list-container\" ng-controller=\"itemListController\" ng-hide=\"isItemListDetailsEmpty()\"> <div class=\"container-header recommendations-header\"> <h2> <span ng-bind=\"itemListLayout.heading\"></span> </h2> <a class=\"btn-more see-all-link-icon btn-secondary-xs\" ng-href=\"{{itemListLayout.seeMoreLink}}\" ng-bind=\"'Action.SeeMore' | translate\"></a> </div> <div class=\"recommended-items-slider\"> <ul class=\"hlist item-cards recommended-items\" ng-show=\"isItemListDetailsAvailable()\"> <li ng-repeat=\"item in items\" class=\"list-item item-card recommended-item\"> <div class=\"item-card-container recommended-item-link\"> <a ng-href=\"{{ item.absoluteUrl }}\" class=\"item-card-link\"> <thumbnail-2d class=\"item-card-thumb-container\" thumbnail-type=\"item.thumbnail.type\" thumbnail-target-id=\"item.id\"> </thumbnail-2d> <div class=\"item-card-name recommended-name\" title=\"{{ item.name }}\"> {{ item.name }} </div> </a> <div ng-if=\"item.audioUrl\" class=\"MediaPlayerControls\"> <div class=\"MediaPlayerIcon icon-play\" data-mediathumb-url=\"{{item.audioUrl}}\"></div> </div> <div ng-if=\"item.creator\" class=\"text-overflow item-card-creator recommended-creator\"> <span ng-bind-html=\"'Label.ByCreatorLink'| translate:{\r\n                                      linkStart: '<a target=_self class=\\'creator-name text-link\\' href=\\'' + item.creator.profileLink + '\\'>', linkEnd: '</a>', creator: item.creator.nameForDisplay }\"> </span> </div> <div class=\"text-overflow item-card-price\"> <span class=\"icon-robux-16x16\" ng-show=\"item.price\"></span> <span class=\"text-robux-tile\" ng-show=\"item.price\">{{ item.price | abbreviate : 1 }}</span> <h4 class=\"text text-label\" ng-hide=\"item.price\"> <span class=\"text-overflow font-caption-body\" ng-if=\"item.product.noPriceText.length > 0\" ng-class=\"{'text-robux-tile': item.product.isFree}\"> {{item.product.noPriceText}} </span> </h4> </div> </div> </li> </ul> <span class=\"spinner spinner-default\" ng-hide=\"isItemListDetailsAvailable()\"></span> </div> </div> ";
