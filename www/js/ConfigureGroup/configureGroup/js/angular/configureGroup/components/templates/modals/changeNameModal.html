module.exports = "<div id=\"change-name\"> <div class=\"modal-header\"> <button type=\"button\" class=\"close\" ng-click=\"close()\"> <span class=\"icon-close\"></span> </button> <div class=\"modal-title\"> <h4 ng-bind=\"'Heading.ChangeGroupName' | translate\"></h4> </div> </div> <div class=\"modal-body\"> <p class=\"body-text text-description\" ng-bind-html=\"'Description.ChangeGroupNameCost' | translate:{ robuxAmount: layout.groupNameChangeCostHtml}\"> </p> <div class=\"form-group form-has-feedback\" ng-class=\"{'form-has-error': layout.hasFocusedOnName && !layout.name }\"> <label class=\"text-label\" for=\"new-group-name\" ng-bind=\"'Label.NewGroupName' | translate\"></label> <input id=\"new-group-name\" class=\"form-control input-field\" maxlength=\"{{ params.metadata.groupConfiguration.nameMaxLength }}\" ng-model=\"layout.name\" ng-blur=\"layout.hasFocusedOnName = true\" placeholder=\"{{'Description.NewGroupName' | translate}}\"> <p class=\"form-control-label\" ng-if=\"layout.hasFocusedOnName && !layout.name.length\" ng-bind=\"'Message.NameFieldEmpty' | translate\"></p> <p class=\"form-control-label\" ng-if=\"layout.name && layout.name.length > 0\" ng-bind=\"layout.name.length | formatCharacterCount: params.metadata.groupConfiguration.nameMaxLength\"> </p> </div> <div class=\"checkbox\"> <input id=\"group-name-change-details-checkbox\" type=\"checkbox\" ng-checked=\"layout.areTermsAccepted\" ng-click=\"toggleAreTermsAccepted()\"/> <label for=\"group-name-change-details-checkbox\" class=\"group-name-change-terms font-caption-body\"> <ul ng-bind-html=\"'Description.GroupNameChangeTerms' | translate:{ numDays: params.metadata.groupNameChangeConfiguration.cooldownInDays, listStart: '<ul>', listEnd: '</ul>', listItemStart: '<li>', listItemEnd: '</li>'}\"> </ul> <ul class=\"group-name-change-verified-badge-warning\" ng-show=\"layout.showVerifiedBadgeForGroup\"> <li> {{ layout.verifiedBadgeChangeGroupNameListItemText }} </li> </ul> </label> </div> </div> <div class=\"
