module.exports = "<li class=\"list-item avatar-card\"> <div class=\"avatar-card-container\"> <div class=\"avatar-card-content\"> <div class=\"avatar avatar-card-fullbody\"> <a ng-href=\"{{$ctrl.memberProfileUrl}}\"> <thumbnail-2d class=\"avatar-card-image\" thumbnail-type=\"$ctrl.thumbnailTypes.avatarHeadshot\" thumbnail-target-id=\"$ctrl.member.userId\"></thumbnail-2d> </a> </div> <div class=\"avatar-card-caption avatar-card-caption-with-menu\"> <span> <div class=\"group-member-name-container\"> <a ng-href=\"{{'users' | seoUrl:$ctrl.member.userId:'profile'}}\" class=\"avatar-name text-overflow\" ng-bind=\"$ctrl.member.nameForDisplay\" title=\"{{ $ctrl.member.nameForDisplay }}\"></a> <span ng-if=\"$ctrl.member.hasVerifiedBadge\" class=\"verified-badge-icon-member-card\" data-size=\"Subheader\" data-overrideimgclass=\"verified-badge-icon-member-card-rendered\"> </span> </div> <div class=\"avatar-card-label text-overflow\" ng-bind=\"'@' + $ctrl.member.username\"> </div> </span> </div> <div class=\"avatar-card-menu group-menu\" ng-if=\"$ctrl.canModerateUser()\"> <button class=\"btn-generic-more-sm\" popover-placement=\"bottom-right\" popover-trigger=\"'outsideClick'\" uib-popover-template=\"'configure-group-member-card-popover'\" title=\"More\"> <span class=\"icon-more\"></span> </button> </div> </div> <div class=\"input-group-btn group-dropdown avatar-card-btns\"> <button type=\"button\" class=\"input-dropdown-btn\" data-toggle=\"dropdown\" ng-disabled=\"!$ctrl.canChangeRankOfUser()\" title=\"{{ $ctrl.member.role.name }}\"> <span class=\"rbx-selection-label\" ng-bind=\"$ctrl.member.role.name\"></span> <span class=\"icon-down-16x16\"></span> </button> <ul data-toggle=\"dropdown-menu\" class=\"dropdown-menu\" role=\"menu\"> <li ng-repeat=\"role in $ctrl.configurableRoles\" ng-class=\"{ 'active': role.id === $ctrl.member.role.id }\" ng-if=\"role.rank !== $ctrl.metadata.roleConfiguration.minRank && role.rank !== $ctrl.metadata.roleConfiguration.maxRank\" title=\"{{ role.name }}\"> <a ng-click=\"$ctrl.clickUpdateUserRole($ctrl.member, role, $ctrl.index)\"> <span class=\"text-overflow\" ng-bind=\"role.name\"></span> </a> </li> </ul> </div> </div> </li>";
