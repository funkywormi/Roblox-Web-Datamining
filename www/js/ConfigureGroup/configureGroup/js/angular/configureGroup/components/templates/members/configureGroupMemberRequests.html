module.exports = "<div class=\"container-header\"> <h2 class=\"group-title-with-input\" ng-bind=\"'Heading.Requests' | translate\"></h2> <div class=\"input-group search-container requests-button-container\"> <input ng-keyup=\"$event.keyCode === $ctrl.keyCodes.enter && $ctrl.getUserRequest($ctrl.keyword)\" ng-model=\"$ctrl.keyword\" class=\"form-control input-field\" placeholder=\"{{'Label.SearchUsers' | translate }}\"/> <div class=\"input-group-btn\"> <button ng-click=\"$ctrl.getUserRequest($ctrl.keyword)\" class=\"input-addon-btn\" type=\"submit\"> <span class=\"icon-search\"></span> </button> </div> <button ng-click=\"$ctrl.declineAllRequests()\" type=\"button\" class=\"decline-requests-button btn-control-sm\" ng-bind=\"'Action.DeclineAll' | translate\"> </button> <button ng-click=\"$ctrl.acceptAllRequests()\" type=\"button\" class=\"accept-requests-button btn-cta-sm\" ng-bind=\"'Action.AcceptAll' | translate\"> </button> </div> </div> <div class=\"section\"> <div ng-show=\"$ctrl.requests.length == 0 && !memberRequestsPager.isBusy() && !$ctrl.layout.isLoading\" class=\"section-content-off\" ng-bind=\"'Message.NoPendingRequests' | translate\"></div> <span ng-show=\"$ctrl.layout.isLoading\" class=\"spinner spinner-default\"></span> <ul ng-class=\"{'faded': memberRequestsPager.isBusy()}\" class=\"hlist avatar-cards\"> <configure-group-member-request-card member-request=\"memberRequest\" group=\"$ctrl.group\" reload-current-page=\"memberRequestsPager.removeItemAtIndex($index)\" ng-repeat=\"memberRequest in $ctrl.requests\"></configure-group-member-request-card> </ul> <div ng-show=\"$ctrl.requests.length > 0\" class=\"pager-holder\" cursor-pagination=\"memberRequestsPager\"></div> </div>";
